name: glib-backport

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    env:
      # Avoid a rustc 1.94.1 narrow-terminal diagnostic renderer panic.
      # This changes formatting only, not optimization or warning levels.
      RUSTFLAGS: --diagnostic-width=200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Verify exact upstream backport and original-version advisories
        run: |
          node scripts/verify-glib-backport.mjs
          node --test tests/glib-backport.test.mjs tests/glib-advisories.test.mjs
          node scripts/check-glib-advisories.mjs
      - name: Exercise real GLib in debug and optimized builds
        run: |
          cargo +1.94.1 fmt --manifest-path desktop/security/glib-variant-iter/Cargo.toml --all -- --check
          cargo +1.94.1 clippy --manifest-path desktop/security/glib-variant-iter/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.94.1 test --manifest-path desktop/security/glib-variant-iter/Cargo.toml --locked
          cargo +1.94.1 test --manifest-path desktop/security/glib-variant-iter/Cargo.toml --locked --release
      # Direct Cargo commands do not run Tauri's beforeBuildCommand.
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Stage Windows runtime resources for Linux compile-only check
        # The CLI intentionally accepts Windows only. This packaging API verifies
        # and copies the same pinned resources; Linux never executes node.exe.
        run: node --input-type=module -e "const { prepareRuntime } = await import('./desktop/scripts/prepare-runtime.mjs'); const manifest = await prepareRuntime(); console.log('Staged', manifest.platform, manifest.arch, Object.keys(manifest.files).length, 'files for compile-only validation');"
      - run: npm --prefix desktop run build
      - name: Compile the locked Tauri Linux dependency graph
        run: |
          cargo +1.94.1 fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check
          cargo +1.94.1 clippy --manifest-path desktop/src-tauri/Cargo.toml --locked -- -D warnings
          cargo +1.94.1 check --manifest-path desktop/src-tauri/Cargo.toml --locked

  windows-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm --prefix desktop run prepare:runtime --if-present
      - run: npm --prefix desktop run build
      - run: cargo +1.94.1 fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check
      - run: cargo +1.94.1 clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.94.1 test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - name: Build the Windows desktop with production assets
        run: cargo +1.94.1 build --manifest-path desktop/src-tauri/Cargo.toml --locked --features tauri/custom-protocol
