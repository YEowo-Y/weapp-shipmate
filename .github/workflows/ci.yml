name: validate-rules

# 规则数据门禁：每次 push / PR 自动校验 flow.yaml 与 rules/*.yaml
# 是否符合 schema、flow 图是否完整、跨文件 stage 是否一致。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm test
      # .mcpb 打包冒烟：暂存纯生产副本 + 启动 staged server 自检，防分发回归。
      # NO_PACK 跳过需联网的 mcpb pack，只验我们自己拥有的部分，快且不依赖外部 CLI。
      - name: mcpb package smoke
        run: npm run build:mcpb
        env:
          WEAPP_SHIPMATE_NO_PACK: "1"
