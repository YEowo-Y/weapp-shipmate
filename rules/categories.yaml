# rules/categories.yaml —— 功能特征 → 服务类目建议 + 高频被拒预警
# ⚠️ 保持 draft: true。原因：官方类目页已核验"部分类目需专项资质""个人主体开放类目明显少于
#    非个人主体"，但**未明确表述"个人主体在某类目大概率被拒"的具体原因**——该断言为合理推断，
#    非官方原文，按 GOVERNANCE.md 不进默认规则集。signal 为启发式，仅提示人工确认。
schema_version: 1
rules:
  - id: category.medical-hint
    title: "医疗相关功能类目预警"
    kind: navigation
    stage: category
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: blocker
    confidence: medium
    signal: ["问诊", "挂号", "处方", "诊断", "医生"]
    warn: "医疗服务类目通常需《医疗机构执业许可证》等专项资质；个人主体开放类目明显少于非个人主体，选择前请对照官方类目所需材料确认。"
    requires:
      - "对照官方『服务类目』确认医疗类所需资质，个人主体慎选"
    why: "医疗类目要求专项资质，主体或材料不符会被拒"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/material/"
    source_quote: "各类目均有具体资质要求，如医疗服务类需提供《医疗机构执业许可证》；个人主体小程序开放类目明显少于非个人主体。"
    last_verified: "2026-06-13"
    manual_required: true
    draft: true

  - id: category.payment-hint
    title: "支付/收款功能类目与资质预警"
    kind: navigation
    stage: category
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    signal: ["支付", "收款", "充值", "微信支付", "下单"]
    warn: "涉及交易/电商的类目通常要求《增值电信业务经营许可证》等资质，个人主体开放类目有限，请对照官方类目所需材料确认。"
    requires:
      - "对照官方『服务类目』确认交易/支付类所需资质与主体要求"
    why: "交易/电商类目对资质与主体有要求，个人主体常受限"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/material/"
    source_quote: "电商平台需提供《增值电信业务经营许可证》等；个人主体小程序开放类目明显少于非个人主体。"
    last_verified: "2026-06-13"
    manual_required: true
    draft: true
