# rules/data.yaml —— 用户数据收集：告知用途 + 明确同意
# 已核验官方来源（2026-06-14）：引自《微信小程序平台常见拒绝情形》(reject.html 3.4.1)，
# 平台明文规则，confidence=high、默认输出。与 privacy-apis.yaml（隐私指引声明）互补：
# 此条是收集数据时"告知用途 + 取得明确同意授权"的通则。kind=navigation，manual_required: true。
schema_version: 1
rules:
  - id: data.collection-consent
    action_categories: ["code", "manual_check"]
    title: "收集用户数据须告知用途并取得同意"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    signal: ["收集", "采集", "填写", "注册", "实名", "身份证", "手机号", "用户信息"]
    warn: "收集用户数据前须明确告知用户该数据的用途，并取得用户明确同意和授权；勿默认勾选或在用户不知情时收集。"
    requires:
      - "在收集用户数据前明确告知用途，取得用户明确同意和授权"
    why: "未告知用途或未取得明确同意即收集用户数据会被拒审，并涉个人信息保护合规风险"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/reject.html"
    source_quote: "明确告知用户该数据的用途，确保经过用户明确同意和授权"
    last_verified: "2026-11-13"
    manual_required: true

  - id: data.delete-on-request
    action_categories: ["code", "manual_check"]
    title: "须提供用户数据删除方式"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    signal: ["注销", "删除账号", "删除数据", "账号注销", "清除数据"]
    warn: "若收集了用户数据，须向用户提供修改 / 删除其数据的方式，用户要求删除时能自行操作完成，且数据被不可恢复地完全删除。"
    requires:
      - "提供可由用户自行操作的『修改 / 删除用户数据』入口，确保删除后数据不可恢复、不可撤销地被完全删除"
    why: "未向用户提供数据删除方式不符合运营规范，涉个人信息保护合规风险并可能被处理"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/"
    source_quote: "微信小程序应当向用户提供修改、删除用户数据的方式，确保用户要求删除其用户数据时可通过该方式自行操作完成，并确保相关数据不可恢复、不可撤销地被完全删除。"
    last_verified: "2026-11-13"
    manual_required: true

  - id: data.security-measures
    action_categories: ["code", "manual_check"]
    title: "收集用户数据须采取安全保护措施"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    signal: ["收集", "存储", "数据库", "用户数据", "个人信息", "上传"]
    warn: "收集用户数据后，须采取必要、合理、有效的安全保护措施，防止数据被盗 / 泄漏 / 披露；勿明文存储敏感数据、勿前端持有密钥。"
    requires:
      - "对收集的用户数据采取安全保护措施（加密传输与存储、访问控制等），防止被盗 / 泄漏 / 披露"
    why: "未采取数据安全保护措施违反运营规范，涉个人信息保护合规风险"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/"
    source_quote: "微信小程序收集用户的数据后，应当采取必要、合理、有效的安全保护措施，防止任何形式的用户数据被盗、泄漏、披露等事件。"
    last_verified: "2026-11-13"
    manual_required: true
