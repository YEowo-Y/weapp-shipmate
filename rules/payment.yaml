# rules/payment.yaml —— 支付 / 虚拟支付规范
# 已核验官方来源：
#   - virtual-must-use-official：《运营规范》5.13（developers.weixin.qq.com/miniprogram/product/），
#     source_quote 取 5.13 无省略的连续片段。
#   - requires-merchant：微信支付《小程序支付》产品介绍「准入条件」（pay.weixin.qq.com/docs/...），
#     source_quote 取准入主体类型的连续原文（个人主体不在其列）。
# 两条均 confidence=high、默认输出、manual_required: true。
schema_version: 1
rules:
  - id: payment.virtual-must-use-official
    title: "虚拟商品须用小程序虚拟支付，不得外跳"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: blocker
    confidence: high
    signal: ["充值", "会员", "虚拟", "点券", "游戏币", "解锁", "订阅", "付费"]
    warn: "小程序内售卖虚拟商品（会员/解锁/订阅/虚拟币等）须接入『小程序虚拟支付』，不得引导用户到 App/公众号/H5/个人号/网站完成支付。"
    requires:
      - "虚拟商品的购买与支付接入小程序虚拟支付，不得外跳到 App/公众号/H5/网站等完成支付"
    why: "虚拟商品绕开小程序虚拟支付、引导外部渠道支付会被限制功能或拒审"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/"
    source_quote: "购买和支付均需接入小程序虚拟支付；不得引导至app、公众号、h5、个人号、网站完成支付"
    last_verified: "2026-07-16"
    manual_required: true

  - id: payment.requires-merchant
    title: "微信支付需商户准入资质（个人主体不支持）"
    kind: preflight
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    match:
      api: ["wx.requestPayment"]
      scanner: static_api_call
    requires:
      - "确认主体具备微信支付准入资质：个体工商户/企业/事业单位/政府机关/社会组织之一；个人主体不在准入范围、无法开通微信支付"
    why: "调用 wx.requestPayment 需具备微信支付商户准入资质；个人主体不在准入主体范围内，无法开通微信支付（商户密钥泄露另见硬编码密钥核验）"
    official_url: "https://pay.weixin.qq.com/docs/merchant/products/mini-program-payment/introduction.html"
    source_quote: "支持的主体类型：个体工商户、企业、事业单位、政府机关、社会组织"
    last_verified: "2026-06-21"
    manual_required: true
