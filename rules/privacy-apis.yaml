    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/miniprogram-intro.html"
    source_quote: "访问你的摄像头 wx.authorize({scope: 'scope.camera'})、wx.createVKSession、<camera>"
    last_verified: "2026-06-14"
    manual_required: true

