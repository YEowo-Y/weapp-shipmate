    why: "通过 button open-type=getPhoneNumber 或 wx.getRealtimePhoneNumber 获取手机号属处理用户个人信息，未声明会在提审被拦截"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/"
    source_quote: "小程序、插件中涉及处理用户个人信息的开发者，均需补充相应用户隐私保护指引。"
    last_verified: "2026-06-13"
    manual_required: true

  # 以下 4 条 confidence=high：官方《用户隐私保护指引内容介绍》(miniprogram-intro.html)
  # 逐项列出"信息类型 ↔ 接口"映射，故 API→声明项不再是推断，而是官方明文。
  - id: privacy.clipboard
    title: "剪贴板隐私声明"
    kind: both
    stage: privacy
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    match:
      api: ["wx.getClipboardData", "wx.setClipboardData"]
      scanner: static_api_call
    requires:
      - "在《小程序用户隐私保护指引》中声明：剪切板"
    why: "读写剪贴板属处理用户个人信息，未声明会在提审被拦截"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/miniprogram-intro.html"
    source_quote: "读取你的剪切板 wx.setClipboardData、wx.getClipboardData"
    last_verified: "2026-06-14"
    manual_required: true

  - id: privacy.record
    title: "麦克风隐私声明"
    kind: both
    stage: privacy
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    match:
      api: ["wx.startRecord", "wx.getRecorderManager", "wx.joinVoIPChat"]
      config_key: ["component.live-pusher"] # <live-pusher> 直播推流采集麦克风（官方组件需 scope.record）
      scanner: static_api_call
    requires:
      - "在《小程序用户隐私保护指引》中声明：麦克风"
    why: "访问麦克风/录音属处理用户个人信息，未声明会在提审被拦截"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/miniprogram-intro.html"
    source_quote: "访问你的麦克风 wx.authorize({scope: 'scope.record'})、wx.startRecord、RecorderManager.start"
    last_verified: "2026-06-14"
    manual_required: true

