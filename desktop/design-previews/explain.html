<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>上线船友 · 拒因反查</title>
  <link rel="stylesheet" href="app.css"/>
  <link rel="stylesheet" href="components/ui-kit.css"/>
  <link rel="stylesheet" href="explain.css"/>
  <link rel="stylesheet" href="responsive.css"/>
</head>
<body data-theme="light">
  <div class="chrome">
    <b>上线船友 · 拒因反查</b>
    <span class="sub">从审核反馈找到相关规则与处理方向</span>
    <button class="ctl" id="themeBtn">深色</button>
  </div>
  <div class="stage-wrap">
    <div class="win">
      <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span><span class="tt">上线船友 — 拒因反查</span></div>
      <main class="explain scroll">
        <div class="explain__inner">
          <header class="explain__head">
            <p class="explain__eyebrow">核查与处理</p>
            <h1>找到拒因的处理方向</h1>
            <p class="explain__sub">粘贴审核反馈或关键词，检索本地规则库中的相关要求和官方依据。</p>
          </header>
          <details class="rj-query" id="rjQuery" open>
          <summary id="rjQuerySummary" hidden><span class="rj-query__label">审核反馈</span><span class="rj-query__text" id="rjQueryText"></span><span class="rj-query__edit">编辑查询</span></summary>
          <form class="rj-form" id="rjForm">
            <label class="rj-label" for="rjInput">审核拒绝原因</label>
            <textarea class="rj-ta" id="rjInput" aria-describedby="rjHint rjStatus" maxlength="4096" spellcheck="false" placeholder="例如：隐私声明不完整、诱导分享"></textarea>
            <p class="rj-hint" id="rjHint">最多 4096 字 · 在本机查询，不发送给模型。按已收录关键词匹配，请结合实际情况核对。</p>
            <div class="rj-actions">
              <wa-button id="rjBtn" data-ui-control="action" type="submit" form="rjForm" size="s" variant="brand">查询处理方向</wa-button>
              <wa-button id="rjStop" data-ui-control="action" type="button" size="s" appearance="outlined" hidden>停止查询</wa-button>
              <wa-button id="rjSample" data-ui-control="action" type="button" size="s" appearance="plain">填入位置权限示例</wa-button>
            </div>
          </form>
          </details>
          <p id="rjStatus" role="status" aria-live="polite" aria-atomic="true">输入审核反馈，查看可核对的规则与官方来源。</p>
          <section class="rj-result" id="rjResult" aria-labelledby="rjResultHeading" hidden>
            <h2 class="rj-result__h" id="rjResultHeading" tabindex="-1">查询结果</h2>
            <div class="rj-result__actions" aria-label="结果操作">
              <wa-button id="rjCopy" data-ui-control="action" size="s" appearance="outlined" disabled>复制结果</wa-button>
              <wa-button id="rjDownload" data-ui-control="action" size="s" appearance="outlined" disabled>下载 Markdown</wa-button>
              <wa-button id="rjSave" data-ui-control="action" size="s" appearance="outlined" hidden disabled>加入当前会话</wa-button>
            </div>
            <p id="rjActionStatus" role="status" aria-live="polite" aria-atomic="true"></p>
            <div id="rjResultItems"></div>
          </section>
          <nav class="explain-related" aria-label="相关页面">
            <a data-journey-return href="main-four-region.html">返回上线工作台</a>
            <a href="index.html">设计参考与示例</a>
          </nav>
          <p class="guard-note">查询依据仓库收录的规则，不会扫描项目或实时核验官方页面，不构成合规担保。官方后台的提交、核验与发布需你本人完成。</p>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="components/ui-kit.js"></script>
  <script type="module" src="explain-page.js"></script>
  <script src="preview.js"></script>
  <script src="responsive.js"></script>
</body>
</html>
