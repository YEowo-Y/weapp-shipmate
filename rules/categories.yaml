# rules/categories.yaml —— 功能特征 → 服务类目资质预警
# 已核验官方来源（2026-06-14，《服务类目》material 页）：各类目所需专项资质（许可证名）为官方逐字；
# 个人主体开放类目由官方『个人主体小程序开放的服务类目』单独列举，医疗/金融/电商平台等需企业资质的
# 类目个人主体未开放。据此 promote 为非 draft；不再断言"个人主体大概率被拒"（改为对照官方类目确认）。
# confidence=medium：许可证名逐字可核验，但 signal→类目→资质 的映射含启发式，故不取 high。
schema_version: 1
rules:
  - id: category.medical-hint
    action_categories: ["manual_check"]
    title: "医疗相关功能类目资质预警"
    kind: navigation
    stage: category
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: blocker
    confidence: medium
    signal: ["问诊", "挂号", "处方", "诊断", "医生", "买药"]
    warn: "医疗相关功能通常属需专项资质的类目（如《医疗机构执业许可证》《互联网药品信息服务资格证》等）；此类需企业资质的类目个人主体未开放——选类目前请对照官方『服务类目』与『个人主体小程序开放的服务类目』确认。"
    requires:
      - "对照官方『服务类目』确认医疗类所需专项资质；个人主体另对照『个人主体开放类目』确认是否可申请"
    why: "医疗类目要求专项资质（许可证），主体或材料不符会被拒；个人主体未开放此类需企业资质的类目"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/material/"
    source_quote: "《医疗机构执业许可证》"
    last_verified: "2026-11-13"
    manual_required: true

  - id: category.payment-hint
    action_categories: ["manual_check"]
    title: "交易/电商功能类目与资质预警"
    kind: navigation
    stage: category
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    signal: ["支付", "收款", "充值", "微信支付", "下单", "商城", "电商"]
    warn: "涉及交易/电商平台的类目通常需《增值电信业务经营许可证》等资质；此类需企业资质的类目个人主体未开放——请对照官方『服务类目』与『个人主体开放类目』确认。"
    requires:
      - "对照官方『服务类目』确认交易/电商类所需专项资质与主体要求"
    why: "交易/电商平台类目要求专项资质（如增值电信业务经营许可证），个人主体未开放此类需企业资质的类目"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/material/"
    source_quote: "《增值电信业务经营许可证》（核准服务项目需含在线数据处理与交易处理业务）"
    last_verified: "2026-11-13"
    manual_required: true

  - id: category.personal-subject-scope
    action_categories: ["manual_check"]
    title: "个人主体只开放有限服务类目（白名单外不开放）"
    kind: navigation
    stage: category
    subject_type: ["personal"]
    severity: warning
    confidence: medium
    signal: ["医美", "医疗美容", "隆鼻", "激光", "推拿", "洗浴", "金融", "直播", "新闻", "电商平台"]
    warn: "个人主体小程序只开放官方『个人主体小程序开放的服务类目』白名单内的类目；白名单外的（如医疗美容、推拿、洗浴，及医疗/金融/电商平台/新闻直播等需企业资质的类目）个人主体未开放，需升级为企业 / 个体工商户主体。"
    requires:
      - "对照官方『个人主体小程序开放的服务类目』确认你的业务在白名单内；不在则需升级主体类型再申请该类目"
    why: "个人主体类目范围受限，选了未开放类目无法通过审核；官方明确部分类目个人小程序未开放"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/material/"
    source_quote: "不包含医疗美容服务（如：隆鼻、激光等）、推拿、洗浴等个人小程序中未开放类目经营范围。"
    last_verified: "2026-11-13"
    manual_required: true

  - id: category.news-hint
    action_categories: ["manual_check"]
    title: "新闻 / 资讯类目资质预警"
    kind: navigation
    stage: category
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    signal: ["新闻", "资讯", "时政", "头条", "采编", "快讯"]
    warn: "提供新闻 / 多行业资讯类内容通常需《互联网新闻信息服务许可证》；此类需企业资质的类目个人主体未开放——请对照官方『服务类目』确认主体与资质。"
    requires:
      - "对照官方『服务类目』确认新闻 / 资讯类所需许可证；个人主体未开放此类需企业资质的类目"
    why: "新闻 / 资讯类目要求《互联网新闻信息服务许可证》，主体或资质不符会被拒；个人主体未开放"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/material/"
    source_quote: "《互联网新闻信息服务许可证》"
    last_verified: "2026-11-13"
    manual_required: true

  - id: category.finance-hint
    action_categories: ["manual_check"]
    title: "金融类目资质预警"
    kind: navigation
    stage: category
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    signal: ["金融", "理财", "借贷", "贷款", "证券", "期货", "基金", "股票", "保险", "银行", "征信"]
    warn: "金融类（银行 / 证券 / 保险 / 贷款 / 征信等）通常需《金融许可证》《经营证券期货业务许可证》等专项持牌资质；此类个人主体未开放——请对照官方『服务类目』确认。"
    requires:
      - "对照官方『服务类目』确认金融类所需许可证与主体要求；个人主体未开放此类持牌类目"
    why: "金融类目要求金融牌照（如《金融许可证》《经营证券期货业务许可证》），个人主体未开放"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/material/"
    source_quote: |-
      1.《金融许可证》
      2.《金融机构许可证》
    last_verified: "2026-11-13"
    manual_required: true

  - id: category.live-hint
    action_categories: ["manual_check"]
    title: "直播类目资质预警"
    kind: navigation
    stage: category
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    signal: ["直播", "直播带货", "在线直播", "直播答题", "视频直播"]
    warn: "提供在线直播服务通常需《信息网络传播视听节目许可证》等资质；此类需企业资质的类目个人主体未开放——请对照官方『服务类目』确认主体与资质。"
    requires:
      - "对照官方『服务类目』确认直播类所需许可证与主体要求；个人主体未开放此类需企业资质的类目"
    why: "直播类目要求《信息网络传播视听节目许可证》等资质，个人主体未开放"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/material/"
    source_quote: "《信息网络传播视听节目许可证》"
    last_verified: "2026-11-13"
    manual_required: true

  - id: category.law-hint
    action_categories: ["manual_check"]
    title: "法律 / 律师类目资质预警"
    kind: navigation
    stage: category
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    signal: ["律师", "法律咨询", "法律服务", "在线法律", "诉讼"]
    warn: "个人主体提供律师服务时，对照「商业服务-律师」核验《律师执业资格证》。机构提供法律咨询或诉讼代理时，按实际业务核对「法律服务平台」或「律所服务」所列材料。"
    requires:
      - "个人律师核对执业资格。法律服务平台核对经营范围含法律咨询的营业执照或仲裁委员会登记证；律所服务核对律师事务所执业许可证书或司法厅批准成立法律服务机构的文件。"
    why: "官方对个人律师、法律服务平台和律所服务分别列有主体和资质要求。"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/material/"
    source_quote: "《律师执业资格证》"
    last_verified: "2026-11-13"
    manual_required: true

  - id: category.education-hint
    action_categories: ["manual_check"]
    title: "教育信息展示、线上课程销售与视频课程的类目要求"
    kind: navigation
    stage: category
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    signal: ["课程", "卖课", "网课", "培训", "在线教育", "付费课程", "讲座"]
    warn: "个人主体的「教育信息展示」只支持信息展示。线上销售课程请核对「课程销售」的三项材料；为多家机构销售课程请核对「课程销售平台」。提供网课、讲座等教育视频或直播时，还需核对「在线视频课程」类目。"
    requires:
      - "「课程销售」同时核对三项材料：非经营性互联网信息服务备案核准或增值电信业务经营许可证（核准服务项目含互联网信息服务）、经营范围含教育咨询服务的营业执照、加盖公章的用户交易纠纷处理机制或方案。"
      - "为多家机构提供销售服务的，核对「课程销售平台」的增值电信业务经营许可证及核准服务项目；提供教育视频或直播的，另核对「在线视频课程」所列资质。"
    why: "「课程销售」与「课程销售平台」分别列有材料要求，个人主体的「教育信息展示」范围不含课程销售和教育视频播放或直播。"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/material/"
    source_quote: "《营业执照》（经营范围需含教育咨询服务）"
    last_verified: "2026-11-13"
    manual_required: true
