# flow.yaml —— 上线流程的决策树骨架（guide 与报告共用阶段标题/顺序；规则匹配不依赖它）
# 受 schemas/flow.schema.json 约束。阶段间的边（next / requires_stage / applies_when）
# 在这里定义；每个阶段的"内容"（要做什么、为什么、官方来源）由 rules/*.yaml 用 stage 挂载。
# 详见 docs/03 「导航的图模型」。
schema_version: 1
stages:
  - stage: registration
    title: "注册小程序账号"
    next: certification
    official_url: "https://developers.weixin.qq.com/community/develop/article/doc/0006c437da87b885b7900de966c013"
    last_verified: "2026-06-13"

  - stage: certification
    title: "主体认证 / 实名核验"
    requires_stage: [registration]
    next: filing
    official_url: "https://developers.weixin.qq.com/community/develop/article/doc/0006c437da87b885b7900de966c013"
    last_verified: "2026-06-13"

  - stage: filing
    title: "ICP 备案"
    requires_stage: [certification]   # 未完成主体认证不进入备案
    next: category
    official_url: "https://developers.weixin.qq.com/miniprogram/product/record_guidelines.html"
    last_verified: "2026-06-13"

  - stage: category
    title: "选择服务类目"
    requires_stage: [certification]
    next: privacy
    official_url: "https://developers.weixin.qq.com/miniprogram/product/material/"
    last_verified: "2026-06-13"

  - stage: privacy
    title: "用户隐私保护指引"
    applies_when: "collects_sensitive == true"   # 不收集敏感信息可跳过此阶段
    next: domain
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/"
    last_verified: "2026-06-13"

  - stage: domain
    title: "服务器域名白名单"
    applies_when: "has_server_domain == true"     # 无自有服务器域名可跳过
    next: review
    last_verified: "2026-06-13"

  - stage: review
    title: "提交审核"
    requires_stage: [filing, category]   # 备案 + 类目未过不进入提审
    next: release
    last_verified: "2026-06-13"

  - stage: release
    title: "发布上线"
    requires_stage: [review]
    next: null            # 终点：唯一 next: null 的阶段
    last_verified: "2026-06-13"
