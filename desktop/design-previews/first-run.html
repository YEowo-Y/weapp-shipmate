<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>上线船友 · 开始使用</title>
<link rel="stylesheet" href="app.css"/>
<link rel="stylesheet" href="components/native-controls.css"/>
<style>
/* ============================================================
   首启引导 First-run — 屏专属组件 (engineered calm · docs/08 §11.4)
   双卡分流(Chatbox 式) + 确定性先行(Semgrep 式)。仅用 app.css 变量。
   ============================================================ */
.fr { overflow: auto; background: var(--bg); min-height: 0; display: flex; justify-content: center; }
.fr__inner { width: 100%; max-width: 560px; padding: 40px 28px 48px; }

/* 顶部：赭橙圆角 logo + 标题 */
.fr__brand { text-align: center; margin-bottom: 28px; }
.fr__logo { width: 56px; height: 56px; border-radius: var(--r-lg); background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
.fr__logo svg { width: 30px; height: 30px; }
.fr__brand h1 { font-size: 25px; font-weight: 500; margin: 0 0 9px; letter-spacing: -.02em; color: var(--text); }
.fr__brand p { font-size: 15px; color: var(--text-2); margin: 0 auto; line-height: 1.65; max-width: 430px; }

/* 一个问题块 */
.frq { min-width: 0; border: 0; padding: 0; margin: 0 0 26px; }
.frq__h { display: flex; align-items: baseline; gap: 9px; margin: 0 0 13px; }
.frq__step { font-family: var(--font-mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 20px; padding: 2px 9px; letter-spacing: -.02em; flex-shrink: 0; }
.frq__q { font-size: 15px; font-weight: 500; color: var(--text); letter-spacing: -.01em; }

/* 双卡选择 */
.frcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.frcard { position: relative; text-align: left; font: inherit; cursor: pointer; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r-lg); padding: 14px 15px 15px; transition: border-color .15s var(--ease), background .15s var(--ease); }
.frcard:hover { border-color: var(--border-2); }
.frcard__top { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.frcard__ico { width: 30px; height: 30px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s var(--ease), color .15s var(--ease); }
.frcard__ico svg { width: 16px; height: 16px; }
.frcard__t { font-size: 15px; font-weight: 500; color: var(--text); letter-spacing: -.01em; }
.frcard__d { font-size: 14px; color: var(--text-2); line-height: 1.55; margin: 0; }
/* Native radio keeps platform keyboard and checked semantics. */
.frcard__radio { position: absolute; top: 13px; right: 13px; width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.frcard__t { padding-right: 20px; }
.frcard__d { display: block; }
.frcard:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
/* 选中态：赭橙描边 + accent-soft 底 */
.frcard:has(input:checked) { border-color: var(--accent); background: var(--surface-2); }
.frcard:has(input:checked) .frcard__ico { background: var(--accent); color: var(--accent-ink); }

/* 每问下方:可跳过浅字 */
.frskip { font-size: 13px; color: var(--text-3); margin: 11px 2px 0; display: inline-flex; align-items: center; gap: 6px; }
.frskip svg { width: 13px; height: 13px; }
.frskip a { color: var(--text-3); text-decoration: none; border-bottom: 1px solid var(--border-2); }
.frskip a:hover { color: var(--accent); border-color: var(--accent); }

/* 底部主操作 + 安全脚注 */
.frgo { display: flex; flex-direction: column; gap: 10px; }
.btn-primary { font: inherit; font-size: 14px; font-weight: 500; padding: 13px 20px; border: 0; border-radius: var(--r); background: var(--accent); color: var(--accent-ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 9px; width: 100%; transition: background .14s var(--ease); }
.btn-primary:hover { background: var(--accent-2); }
.btn-primary svg { width: 17px; height: 17px; }
.frsafe { display: flex; gap: 9px; font-size: 13px; color: var(--text-3); line-height: 1.6; }
.frsafe svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; color: var(--ok); }
.frsafe b { font-weight: 500; color: var(--text-2); }

@media (max-width: 460px) {
  .frcards { grid-template-columns: 1fr; }
}
.frgo p { margin: 0; }
.frsafe { margin-top: 12px !important; padding-top: 18px; border-top: 1px solid var(--border); }
</style><link rel="stylesheet" href="responsive.css" />
</head>
<body data-theme="light">
  <h2 class="sr-only">选择上线前或上线后的示例体验；无需密钥，不读取项目。</h2>

  <div class="chrome">
    <b>上线船友 · 首启引导</b>
    <span class="sub">开始体验 / 选择你的目标</span>
    <button class="ctl" id="themeBtn">深色</button>
  </div>

  <div class="stage-wrap"><div class="win">
    <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span><span class="tt">上线船友 — 欢迎</span></div>

    <div class="fr scroll">
      <form class="fr__inner" id="onboarding-form">

        <!-- 顶部品牌区 -->
        <div class="fr__brand">
          <div class="fr__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" data-brand-icon="true"><path d="M3 18a3.5 3.5 0 0 0 3 1.8h12a3.5 3.5 0 0 0 3-1.8"/><path d="M4 14h16l-2.5 4H6.5L4 14Z"/><path d="M12 14V3l7 6"/><path d="M12 7H7"/></svg>
          </div>
          <h1>欢迎使用上线船友</h1>
          <p>选择当前进度，查看适合你的上线流程与检查示例。</p>
        </div>

        <!-- 选择目标 -->
        <fieldset class="frq">
          <legend class="frq__h"><span class="frq__q">你的小程序上线了吗？</span></legend>
          <div class="frcards" data-group="status">
            <label class="frcard">
              <input class="frcard__radio" type="radio" name="status" value="new" aria-labelledby="choice-new-title" aria-describedby="choice-new-description" checked />
              <span class="frcard__top">
                <span class="frcard__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="components/icons.svg#arrow-right"></use></svg></span>
                <span class="frcard__t" id="choice-new-title">还没上线</span>
              </span>
              <span class="frcard__d" id="choice-new-description">从注册到提审，按 8 个阶段准备上线。</span>
            </label>
            <label class="frcard">
              <input class="frcard__radio" type="radio" name="status" value="live" aria-labelledby="choice-live-title" aria-describedby="choice-live-description" />
              <span class="frcard__top">
                <span class="frcard__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="components/icons.svg#activity"></use></svg></span>
                <span class="frcard__t" id="choice-live-title">已上线</span>
              </span>
              <span class="frcard__d" id="choice-live-description">查看上线后检查示例，了解风险详情与复查路径。</span>
            </label>
          </div>
          <p class="frskip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="components/icons.svg#list-checks"></use></svg>
            也可以<a href="audit.html">先看一份预检示例</a>
          </p>
        </fieldset>

        <!-- 底部主操作 + 安全脚注 -->
        <div class="frgo">
          <button class="btn-primary" id="startBtn" type="submit" aria-describedby="start-description">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="components/icons.svg#arrow-right"></use></svg>
            <span id="start-label">进入上线工作台</span>
          </button>
          <p id="start-description" class="frskip" role="status"></p><p class="frskip"><a id="onboarding-settings" href="settings.html?from=first-run.html%3Fstatus%3Dnew#key">了解模型与连接配置</a> · 可稍后设置</p>
          <p class="frsafe">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="components/icons.svg#shield"></use></svg>
            <span>无需密钥即可体验固定示例，不扫描项目、不请求模型，也不保存业务进度。官方后台的提交与发布由你本人完成。</span>
          </p>
        </div>

      </form>
    </div>

  </div></div>
  <script src="preview.js"></script>
<script src="responsive.js"></script>
<script type="module" src="onboarding.js"></script>
</body></html>
