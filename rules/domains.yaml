# rules/domains.yaml —— 源码里的请求域名 → 提醒配服务器域名白名单
# ⚠️ 冷启动种子：draft: true，source_quote 待核验。见 CONTRIBUTING.md。
schema_version: 1
rules:
  - id: domain.request-whitelist
    title: "服务器域名白名单"
    kind: preflight
    stage: domain
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    match:
      api: ["wx.request", "wx.connectSocket", "wx.uploadFile", "wx.downloadFile"]
      scanner: static_api_call
      dynamic_note: "若 url 由变量/环境拼接（如 baseURL + path），静态扫描可能漏报真实域名，请人工核对所有出站域名是否已加入白名单。"
    requires:
      - "把代码中出现的域名加入 mp 后台『开发管理 → 服务器域名』白名单"
    why: "未配置的域名在真机环境会被拦截"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/ability/network.html"
    source_quote: "（待核验：官方网络/服务器域名说明原文短摘录）"
    last_verified: "2026-06-13"
    manual_required: true
    draft: true

  - id: domain.uni-request
    title: "uni-app 请求域名白名单"
    kind: preflight
    stage: domain
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    match:
      api: ["uni.request", "uni.connectSocket", "uni.uploadFile", "uni.downloadFile"]
      scanner: static_api_call
      dynamic_note: "uni-app 编译到微信后等价 wx.* 请求；条件编译 #ifdef MP-WEIXIN 分支内的域名也需配置。变量拼接域名请人工核对。"
    requires:
      - "把 uni.* 请求中出现的域名加入 mp 后台服务器域名白名单"
    why: "uni-app 编译到微信小程序后，未配置的域名同样在真机被拦截"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/ability/network.html"
    source_quote: "（待核验：官方原文短摘录）"
    last_verified: "2026-06-13"
    manual_required: true
    draft: true
