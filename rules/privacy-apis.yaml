# rules/privacy-apis.yaml —— 隐私 API → 必填《用户隐私保护指引》项
# 已核验官方总则来源（2026-06-13）：处理用户个人信息均需补充隐私保护指引，否则提审受阻。
# confidence=medium：总则已核验，单条 API 与具体声明项的精确映射为合理推断（官方页未逐项列出）。
schema_version: 1
rules:
  - id: privacy.getUserProfile
    title: "用户信息隐私声明"
    kind: both
    stage: privacy
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    match:
      api: ["wx.getUserProfile", "wx.getUserInfo"]
      config_key: ["button.open-type=chooseAvatar"] # 头像填写能力同样收集头像（本规则 requires 已含头像）
      scanner: static_api_call
    requires:
      - "在《小程序用户隐私保护指引》中声明：用户信息（昵称、头像）"
    why: "处理用户个人信息需在隐私指引声明；声明与接口调用不符或为空会在提审被拦截"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/"
    source_quote: "小程序、插件中涉及处理用户个人信息的开发者，均需补充相应用户隐私保护指引。"
    last_verified: "2026-06-13"
    manual_required: true

  - id: privacy.upp-required
    title: "处理用户个人信息须配置《用户隐私保护指引》"
    kind: navigation
    stage: privacy
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    signal: ["收集", "用户信息", "个人信息", "登录", "注册", "授权", "实名"]
    warn: "凡涉及处理用户个人信息，均须在 mp 后台『用户隐私保护』补充《用户隐私保护指引》，且指引内容须与实际隐私接口调用一致；提交代码审核时平台默认拉取现网版本隐私协议，二者有出入或协议为空会在提审时被提醒更新。（插件另有更严门槛：隐私说明须审核通过才可提交版本。）"
    requires:
      - "在 mp 后台『用户隐私保护』补充《用户隐私保护指引》，并保持其内容与实际隐私接口调用一致；提审被拦截时在入口2（管理—版本管理—提交代码审核—信息填写页面）更新后再提交"
    why: "隐私接口调用情况与隐私协议内容有出入、或协议内容为空，会在提审时被提醒更新甚至拦截"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/"
    source_quote: "小程序、插件中涉及处理用户个人信息的开发者，均需补充相应用户隐私保护指引。"
    last_verified: "2026-06-23"
    manual_required: true

  - id: privacy.auth-mechanism-enabled
    title: "隐私授权机制自 2023-10-17 起强制启用"
    kind: navigation
    stage: privacy
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    signal: ["隐私", "授权", "用户信息", "个人信息"]
    warn: "自 2023 年 10 月 17 日起，无论 app.json 是否配置 __usePrivacyCheck__，隐私相关功能都会启用——涉及隐私接口须先配好《用户隐私保护指引》并处理用户授权弹窗，否则接口调用受限。"
    requires:
      - "配置《用户隐私保护指引》并适配隐私授权流程；隐私机制已默认启用，不可依赖关闭 __usePrivacyCheck__ 规避"
    why: "隐私机制已默认强制启用，未配置隐私指引 / 未处理授权会导致隐私接口调用失败、提审受阻"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/PrivacyAuthorize.html"
    source_quote: "在 2023年10月17日之后，不论 app.json 中是否有配置 __usePrivacyCheck__ ，隐私相关功能都会启用。"
    last_verified: "2026-06-23"
    manual_required: true

  - id: privacy.getLocation
    title: "地理位置隐私声明"
    kind: both
    stage: privacy
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    match:
      # R5：wx.chooseLocation 移交 privacy.chooseLocation（confidence:high，官方逐字"收集你选择的位置信息"）——
      # 双规则同触发会对一次调用产出两条不同的声明要求（本大类为 medium 推断），去重以精确规则为准。
      api: ["wx.getLocation", "wx.getFuzzyLocation", "wx.onLocationChange", "wx.startLocationUpdate"]
      scanner: static_api_call
    requires:
      - "在《小程序用户隐私保护指引》中声明：地理位置信息"
      - "在 app.json 的 requiredPrivateInfos 声明相应位置接口（请对照官方位置接口文档确认）"
    why: "处理位置信息需在隐私指引声明；声明缺失会在提审被拦截，部分位置接口未在 requiredPrivateInfos 声明会调用失败"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/"
    source_quote: "小程序、插件中涉及处理用户个人信息的开发者，均需补充相应用户隐私保护指引。"
    last_verified: "2026-06-13"
    manual_required: true

  - id: privacy.getPhoneNumber
