name: release-rehearsal

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run lint
      - name: Verify version and choose distribution tag
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { assertVersionIdentity, readRepositoryVersionIdentity } from './scripts/check-release-version.mjs';
          import { distributionTag } from './scripts/verify-package-rehearsal.mjs';
          const { version } = assertVersionIdentity(readRepositoryVersionIdentity());
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${distributionTag(version)}\n`);
          console.log(`Verified package version ${version}`);
          NODE
      - run: npm test
      - run: npm run verify:quotes
      - run: npm run coverage
      - name: Rehearse publication and compare package manifests
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          mkdir -p build/release-rehearsal
          npm pack --dry-run --ignore-scripts --json > build/release-rehearsal/pack.json
          npm publish --dry-run --ignore-scripts --tag "$DIST_TAG" --json > build/release-rehearsal/publish.json
          node scripts/verify-package-rehearsal.mjs build/release-rehearsal/pack.json build/release-rehearsal/publish.json
          cat build/release-rehearsal/pack.json build/release-rehearsal/publish.json
