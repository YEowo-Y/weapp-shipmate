# rules/filing.yaml —— ICP 备案相关导航规则
# 2026-10-22 迁移备案操作指引地址；仅重新核验该页对应的三条规则。
schema_version: 1
rules:
  - id: filing.required-before-release
    title: "上线前需完成小程序备案"
    kind: navigation
    stage: filing
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: blocker
    confidence: high
    requires:
      - "在 mp 后台发起小程序备案：备案信息填写 → 平台初审 → 工信部短信核验 → 通管局审核 → 备案成功"
      - "收到工信部短信后 24 小时内完成核验，否则备案失败需重提"
    why: "依《反电信网络诈骗法》第二十三条，设立移动互联网应用程序须办理备案；未完成备案无法正常上线"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/record/record_guidelines.html"
    source_quote: "备案整体流程总共分为五个环节：备案信息填写、平台初审、工信部短信核验、通管局审核和备案成功。"
    last_verified: "2026-10-22"
    manual_required: true

  - id: filing.keep-updated
    title: "备案信息变更须及时更新 / 主体异常须注销重备"
    kind: navigation
    stage: filing
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    signal: ["变更", "改名", "更换负责人", "注销", "迁移", "主体变更"]
    warn: "小程序名称 / 负责人 / 主体名称 / 联系方式变更时须及时变更备案；主体经营状态异常（注销 / 吊销 / 撤销）或与备案主体不一致时，须及时注销备案再重新备案。"
    requires:
      - "信息变更后及时在 mp 后台变更备案；主体异常或与备案主体不符时，注销备案并重新发起"
    why: "未及时变更或注销备案违反运营规范，可能导致警告、限制甚至强制注销"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/"
    source_quote: "小程序名称变更、小程序负责人变更、小程序主体名称变更、小程序主体负责人变更、小程序或主体负责人联系方式变更时，都需要及时变更备案信息。"
    last_verified: "2026-07-16"
    manual_required: true

  - id: filing.individual-id-materials
    title: "个人备案需有效身份证件（清晰、有效期 > 1 月）"
    kind: navigation
    stage: filing
    subject_type: ["personal"]
    severity: warning
    confidence: high
    requires:
      - "准备个人有效身份证件，上传彩色扫描件 / 拍照件：图片清晰完整、不遮挡关键信息、边角齐全、证件有效期大于 1 个月"
    why: "证件不清晰 / 被遮挡 / 有效期不足 1 个月会导致备案初审被驳回"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/record/record_guidelines.html"
    source_quote: "上传有效证件原件的彩色扫描件或拍照件，请保持图片清晰完整、不遮挡关键信息/图像、边角齐全，证件有效期大于1个月。"
    last_verified: "2026-10-22"
    manual_required: true

  - id: filing.face-verification
    title: "备案负责人人脸核身环境 / 着装要求"
    kind: navigation
    stage: filing
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    requires:
      - "人脸核身：选白色 / 浅色干净背景、无杂物或他人入镜；不裸露上半身、不戴帽子 / 耳机 / 口罩等遮挡面部物品、表情自然不闭眼"
    why: "人脸核身环境 / 着装不符会导致核验失败、备案受阻"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/record/record_guidelines.html"
    source_quote: "进行核验时需选择白色或浅色的干净背景，不要有杂物或他人入镜；核验人不能裸露上半身，不能戴帽子、耳机、口罩等遮挡面部的物品，保持表情自然、无闭眼。"
    last_verified: "2026-10-22"
    manual_required: true
