# rules/login.yaml —— 账号登录规范（高频拒审）
# 已核验官方来源（2026-06-14）：登录规范条款引自官方《小程序帐号登录规范要求与修改指引》与
# 《运营规范》《常见拒绝情形》(reject.html 3.4.x)，均为平台明文规则，confidence=high、默认输出。
# kind=navigation 内容/交互类，无法静态扫描，全部 manual_required: true。
schema_version: 1
rules:
  - id: login.after-experience
    title: "不得未体验功能即要求授权登录"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: blocker
    confidence: high
    requires:
      - "把授权登录后置：让用户先充分了解、体验功能服务，再由用户主动点击触发登录授权，勿一进首页就强制授权"
    why: "首页打开即要求授权登录、用户未体验功能即强制授权，是最高频的登录规范拒审原因"
    official_url: "https://developers.weixin.qq.com/community/develop/doc/000ea46d08898015317b956c65fc09"
    source_quote: "授权个人信息功能后置，给与用户充分了解、体验功能服务后，再由用户主动点击进一步功能触发登录授权"
    last_verified: "2026-06-14"
    manual_required: true

  - id: login.cancellable
    title: "登录须提供可取消/拒绝且有效"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: blocker
    confidence: high
    requires:
      - "授权登录界面提供『取消/拒绝登录』选项，且点击后须真正生效（可继续浏览），勿点了仍强制登录"
    why: "无取消/拒绝登录按钮、或按钮点击无响应仍强制登录，会被判登录规范不合规"
    official_url: "https://developers.weixin.qq.com/community/develop/doc/000ea46d08898015317b956c65fc09"
    source_quote: "授权同时，亦同时支持给与用户取消登录的权利"
    last_verified: "2026-06-14"
    manual_required: true

  - id: login.no-password-input
    title: "不得请求/诱导输入微信账号密码"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: blocker
    confidence: high
    requires:
      - "任何页面都不得请求或诱导用户输入其微信用户名/密码"
    why: "请求或诱导输入微信账号密码属明令拒审项"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/reject.html"
    source_quote: "不得在小程序任何页面请求或诱导用户输入微信用户的用户名或密码"
    last_verified: "2026-06-14"
    manual_required: true

  - id: login.no-unauthorized-userdata
    title: "不得未经授权显示头像昵称等"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: blocker
    confidence: high
    requires:
      - "未经用户授权同意，不得显示其头像、昵称等用户相关数据"
    why: "未经授权显示用户头像昵称等数据属明令拒审项"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/reject.html"
    source_quote: "不得在未经用户授权同意的情况下，显示用户相关数据，比如：头像，昵称等信息"
    last_verified: "2026-06-14"
    manual_required: true

  - id: login.clear-data-on-refuse
    title: "拒绝授权后须清除并停用其数据"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    requires:
      - "用户拒绝授权后，清除并不再继续使用该用户的微信头像、昵称等数据"
    why: "拒绝授权后仍留存/使用用户头像昵称等数据违反运营规范"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/"
    source_quote: "用户拒绝授权后，开发者有义务清除并不再继续使用该用户的微信头像、昵称等数据。"
    last_verified: "2026-06-14"
    manual_required: true
