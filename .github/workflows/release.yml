name: release

# E1：tag 触发的可复现发布流水线——此前 GitHub Release 资产（tgz + .mcpb）在开发机手工构建，
# 真实 mcpb pack 从未在 CI 跑过，分发通道无可复现性。
# 流程：全量门禁 → npm pack → mcpb pack（锁定版本）→ SHA-256 清单 → 草稿 Release 挂资产。
# 草稿（--draft）：发布前人工核对资产与说明，点击 Publish 才对外——发布是不可逆动作，留人工闸。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 与上传资产所需；其余步骤只读。

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 构建腿用在维 LTS（Node 20 已于 2026-04-30 EOL，不再接收安全更新）；
          # 兼容性由 ci.yml 的 20/22/24 矩阵负责，此处只决定"发布产物由谁构建"。
          node-version: "22"
      - run: npm ci
      # 门禁与 CI 同口径：任何一道红都不允许出资产。
      - run: npm run lint
      - run: npm run release:check
      - run: npm test
      - run: npm run coverage
      # tgz：与 npm registry 发布物同源（registry 发布解锁后两渠道一致性由此保证）。
      - run: npm pack
      # .mcpb：真实 pack（联网拉取锁定版本的打包器），产物 build/weapp-shipmate.mcpb。
      # REQUIRE_PACK：发布上下文里打包失败即致命，错误指向 pack 步骤本身而非下游 checksum（阶段5复核 NOTE）。
      - name: build mcpb bundle
        run: npm run build:mcpb
        env:
          WEAPP_SHIPMATE_REQUIRE_PACK: "1"
      # 校验和必须以下载者视角的扁平资产名生成——gh 上传资产按 basename 拍平，清单里的
      # build/ 前缀会让 `sha256sum -c SHA256SUMS.txt` 对 .mcpb 恒报 No such file（2026-07-16 审计 A3：
      # rc.1 演练验证了流水线跑通，但没有一步是"下载资产后实测校验"）。先把 .mcpb 复制到工作目录再计算。
      - name: checksums
        run: cp build/weapp-shipmate.mcpb . && sha256sum weapp-shipmate-*.tgz weapp-shipmate.mcpb > SHA256SUMS.txt && cat SHA256SUMS.txt
      # 用 runner 自带 gh CLI 而非第三方 action——与仓库"最小供应链面"取向一致。
      # 上传的 .mcpb 用与校验和清单同名的工作目录副本，保证"清单条目 = 资产名"。
      - name: create draft release with assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          weapp-shipmate-*.tgz weapp-shipmate.mcpb SHA256SUMS.txt
