<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>上线船友 · 快捷导航</title>
<link rel="stylesheet" href="app.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="responsive.css" />
</head>
<body data-theme="light">
  <div class="chrome">
    <b>上线船友 · 快捷导航</b>
    <span class="sub">查找页面与阶段</span>
    <button class="ctl" id="themeBtn">深色</button>
  </div>
  <main class="command-page">
    <h1>前往工作区</h1>
    <p>搜索页面或阶段名称，按 Enter 打开；按 Esc 返回来源页面。</p>
    <a class="shipmate-dialog__button" href="main-four-region.html" data-journey-return>返回上线工作台</a>
  </main>
<script src="preview.js"></script>
<script type="module">
  import { returnDestination, destinationLabel } from './navigation.js';
  const ui = await window.shipmateUI.ready;
  if (ui) {
    const destination = returnDestination(location.search, ['command-palette.html']);
    const dialog = ui.openCommand();
    dialog.querySelector('.shipmate-dialog__close').setAttribute('aria-label', `关闭并返回${destinationLabel(destination)}`);
    dialog.addEventListener('close', () => { location.href = destination; }, { once: true });
  }
</script>
</body>
</html>
