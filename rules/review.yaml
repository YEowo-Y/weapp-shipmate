# rules/review.yaml —— 提交审核阶段：高频拒审原因 + 必备提审材料
# 已核验官方来源（2026-06-14）：逐条引自《微信小程序平台常见拒绝情形》(reject.html)，
# 均为平台明文规则（非推断），故 confidence=high、默认输出。
# 这些是 kind=navigation 的内容/政策类规则，无法静态扫描，全部 manual_required: true。
schema_version: 1
rules:
  - id: review.function-matches-intro
    title: "功能须与简介一致"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    requires:
      - "确保小程序实际功能点与『简介』描述一致，简介里没写的功能别上，写了的功能要能用"
    why: "功能与简介不一致是高频拒审原因之一"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/reject.html"
    source_quote: "小程序所实际提供的功能点，需与小程序的简介一致"
    last_verified: "2026-06-14"
    manual_required: true

  - id: review.category-reachable-on-home
    title: "服务类目功能须在首页可达"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    requires:
      - "确保提交的每个服务类目对应功能，能从首页直达或经 2 次点击到达，勿隐藏在深层或付费墙后"
    why: "类目功能在首页不可达会被判定与提交类目不符而拒审"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/reject.html"
    source_quote: "小程序所提供的所有服务类目功能，必须在小程序首页得到体现，即在小程序首页必须能直达或者经过2次点击到达所有本文档2（服务类目审核）中提交的服务类目页面"
    last_verified: "2026-06-14"
    manual_required: true

  - id: review.no-inducement
    title: "禁止诱导分享/关注/下载"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: blocker
    confidence: high
    requires:
      - "移除任何诱导分享、诱导添加、诱导关注公众号、诱导下载的文案/按钮/弹窗，勿以『分享后才可用』强制用户"
    why: "诱导类行为是平台明令拒审项"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/reject.html"
    source_quote: "小程序的页面内容中，存在诱导类行为，包括但不限于诱导分享、诱导添加、诱导关注公众号、诱导下载等"
    last_verified: "2026-06-14"
    manual_required: true

  - id: review.not-mainly-ads
    title: "不得主要为营销/广告用途"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: blocker
    confidence: high
    requires:
      - "确保页面以实际功能为主，移除空白广告位、招商广告等纯营销内容，广告不得遮挡功能"
    why: "页面主要为营销或广告用途将被拒审"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/reject.html"
    source_quote: "小程序的页面内容中，主要为营销或广告用途（如内含空白广告位、招商广告等），将会被拒绝"
    last_verified: "2026-06-14"
    manual_required: true

  - id: review.must-be-finished
    title: "须是完成品（非测试版）"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: blocker
    confidence: high
    requires:
      - "提交前确保小程序可打开、可运行、无崩溃/闪退/空按钮，上架正式内容而非测试商品/占位内容"
    why: "测试版或不可运行的半成品会被直接拒审"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/reject.html"
    source_quote: "提交的小程序须是一个完成品，要求可以打开，可以运行，且不可以是一个测试版"
    last_verified: "2026-06-14"
    manual_required: true

  - id: review.test-account
    title: "有账号体系须提供测试号"
    kind: navigation
    stage: review
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    requires:
      - "若小程序含登录/账号体系，提审时在版本说明里提供可体验全部功能的测试号（账号+密码）"
    why: "缺测试号会导致审核无法体验完整功能而被拒"
    official_url: "https://developers.weixin.qq.com/miniprogram/product/reject.html"
    source_quote: "若小程序中存在账号体系，需提供测试号，包含账号和密码（可以体验所有功能）"
    last_verified: "2026-06-14"
    manual_required: true
