[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
tauri-plugin-notification = "=2.4.0"

[target.'cfg(windows)'.dependencies]
keyring-core = "=1.0.1"
# Includes upstream cross-process Credential Manager serialization (not in registry 1.1.0).
windows-native-keyring-store = { git = "https://github.com/open-source-cooperative/windows-native-keyring-store", rev = "493ecaa5442c3cbd445253ad78b58f54382a9049", default-features = false }

# RUSTSEC-2024-0429: exact upstream fix, preserving the GTK 0.18 API.
# Provenance and removal criteria: ../security/glib-backport/README.md
[patch.crates-io]
glib = { path = "vendor/glib" }

