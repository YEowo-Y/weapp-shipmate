# rules/domains.yaml —— 源码里的请求域名 → 提醒配服务器域名白名单
# 已核验官方来源（2026-06-13），promote 为默认规则集。
schema_version: 1
rules:
  - id: domain.request-whitelist
    action_categories: ["console", "manual_check"]
    title: "服务器域名白名单"
    kind: preflight
    stage: domain
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    match:
      api: ["wx.request", "wx.connectSocket", "wx.uploadFile", "wx.downloadFile"]
      scanner: static_api_call
      dynamic_note: "若 url 由变量/环境拼接（如 baseURL + path），静态扫描可能漏报真实域名，请人工核对所有出站域名是否已加入白名单。uni-app 同理：uni.* 请求编译到微信即 wx.*，条件编译 #ifdef MP-WEIXIN 分支内的域名也需配置。"
    requires:
      - "在『小程序后台 - 开发 - 开发设置 - 服务器域名』中配置网络接口所需的服务器域名；局域网通信和云托管私有协议按官方例外核对"
    why: "网络接口需事先配置服务器域名；局域网通信和云托管私有协议另有适用条件"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/ability/network.html"
    source_quote: "每个微信小程序需要事先设置通讯域名，小程序只可以跟指定的域名进行网络通信。"
    last_verified: "2026-11-13"
    manual_required: true

  - id: domain.web-view-business
    action_categories: ["code", "console", "manual_check"]
    title: "web-view 网页需配置业务域名（个人主体不支持）"
    kind: preflight
    stage: domain
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    match:
      config_key: ["component.web-view"]
      scanner: static_config
    requires:
      - "把 <web-view> 打开的网页域名登录『小程序管理后台』配置为业务域名（与服务器域名是两套白名单），并对照后台当前要求完成域名校验"
      - "确认主体类型：个人类型小程序不支持 web-view 组件"
    why: "web-view 打开的网页需在后台配置业务域名，否则无法加载；且个人类型小程序不支持 web-view"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/component/web-view.html"
    source_quote: "其它网页需登录小程序管理后台配置业务域名。"
    last_verified: "2026-11-13"
    manual_required: true

  - id: domain.web-view-personal
    action_categories: ["code", "console", "manual_check"]
    title: "个人类型小程序不支持 web-view 组件"
    kind: both
    stage: domain
    subject_type: ["personal"]
    severity: blocker
    confidence: high
    match:
      config_key: ["component.web-view"]
      scanner: static_config
    requires:
      - "个人主体不支持 web-view：改用非 web-view 方案，或将主体升级为企业 / 个体工商户后再使用"
    why: "代码使用了 <web-view> 组件，但官方文档明确个人类型小程序暂不支持使用该组件"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/component/web-view.html"
    source_quote: "承载网页的容器。会自动铺满整个小程序页面，个人类型的小程序暂不支持使用。"
    last_verified: "2026-11-13"
    manual_required: true

  - id: domain.must-icp-filed
    action_categories: ["manual_check"]
    title: "服务器域名须经 ICP 备案"
    kind: navigation
    stage: domain
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: high
    requires:
      - "核对需配置为服务器域名的域名是否完成 ICP 备案"
    why: "官方将 ICP 备案列为服务器域名的配置要求"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/ability/network.html"
    source_quote: "域名必须经过 ICP 备案；"
    last_verified: "2026-11-13"
    manual_required: true
