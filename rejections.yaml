# rejections.yaml —— 拒因反查知识库（explain 渲染器的"事实源"）
# 设计：本文件不重复造拒因，而是给"用户实际看到的拒审信号"（审核反馈文案 / 错误码）
# 建一条反向索引，指回 rules/*.yaml 中已逐字核验官方来源的规则。修复步骤与官方原文
# 全部来自被链接规则，绝不在此新增未核验断言（治理见 GOVERNANCE.md）。
# - aliases: 审核反馈里高频出现的关键词（中文按子串匹配，无需分词）。
# - rules:   已核验规则 id（schema 强制 minItems≥1；validate 强制每个 id 真实存在）。
# - codes:   官方错误码（保留字段）。仅当能从官方错误码表逐字核验时才填——
#            如 61040 在官方 app.html 查无明文，故暂不收录，宁缺毋造。
schema_version: 1
rejections:
  - id: reject.inducement
    summary: "页面存在诱导分享 / 诱导关注 / 诱导下载等诱导类行为"
    aliases: ["诱导分享", "诱导关注", "诱导添加", "诱导下载", "诱导", "分享才能", "关注公众号才能", "分享后才可"]
    codes: []
    rules: ["review.no-inducement", "outbound.no-induced-app-download"]
    last_verified: "2026-06-17"

  - id: reject.marketing-ads
    summary: "页面内容主要为营销或广告用途"
    aliases: ["营销", "广告", "广告位", "招商", "推广为主"]
    codes: []
    rules: ["review.not-mainly-ads"]
    last_verified: "2026-06-17"

  - id: reject.unfinished
    summary: "小程序为测试版 / 无法正常打开运行（非完成品）"
    aliases: ["测试版", "无法打开", "闪退", "崩溃", "白屏", "页面空白", "功能无法体验", "无法体验功能", "空白页", "半成品", "完成品", "无法运行"]
    codes: []
    rules: ["review.must-be-finished"]
    last_verified: "2026-10-25"

  - id: reject.no-test-account
    summary: "存在账号体系但未提供可体验全部功能的测试号"
    aliases: ["测试账号", "测试号", "账号体系", "体验账号", "账号和密码", "未提供账号"]
    codes: []
    rules: ["review.test-account"]
    last_verified: "2026-06-17"

  - id: reject.function-mismatch
    summary: "实际功能点与小程序简介不一致"
    aliases: ["功能与简介", "简介不一致", "简介不符", "功能不符", "与描述不符", "简介"]
    codes: []
    rules: ["review.function-matches-intro"]
    last_verified: "2026-06-17"

  - id: reject.category-unreachable
    summary: "提交的服务类目功能在首页不可直达（需 2 次点击内可达）"
    aliases: ["类目功能", "首页不可达", "类目不符", "服务类目", "2次点击", "两次点击", "类目页面"]
    codes: []
    rules: ["review.category-reachable-on-home"]
    last_verified: "2026-06-17"

  - id: reject.forced-login
    summary: "强制登录 / 未体验功能即要求授权登录 / 登录无法取消"
    aliases: ["强制登录", "强制授权", "未体验", "一进入就登录", "登录才能", "无法取消登录", "必须登录", "授权登录"]
    codes: []
    rules: ["login.after-experience", "login.cancellable"]
    last_verified: "2026-06-17"

  - id: reject.userdata-misuse
    summary: "未经授权显示用户头像昵称 / 请求或诱导输入微信用户名密码"
    aliases: ["未授权显示", "头像昵称", "昵称头像", "微信密码", "用户名密码", "用户名或密码", "未经授权"]
    codes: []
    rules: ["login.no-unauthorized-userdata", "login.no-password-input"]
    last_verified: "2026-06-17"

  - id: reject.privacy-guideline
    summary: "调用隐私接口收集个人信息但未配置 / 声明《用户隐私保护指引》"
    aliases: ["隐私保护指引", "用户隐私", "隐私协议", "隐私授权", "收集个人信息", "未声明隐私"]
    codes: []
    rules: ["privacy.getUserProfile", "privacy.getPhoneNumber", "privacy.getLocation"]
    last_verified: "2026-10-25"

  - id: reject.recommend-others
    summary: "未经授权展示 / 推荐其他小程序或公众号、或诱导跳转外部应用"
    aliases: ["推荐其他小程序", "跳转其他小程序", "其他公众号", "外部小程序", "导流", "外链"]
    codes: []
    rules: ["outbound.no-recommend-others"]
    last_verified: "2026-06-17"

  - id: reject.ugc-content
    summary: "含用户可发布内容（UGC）但缺少内容安全过滤机制"
    aliases: ["内容安全", "UGC", "用户发布", "评论功能", "不当内容", "色情", "赌博", "违法违规", "内容过滤"]
    codes: []
    rules: ["content.filter-mechanism", "content.ugc-consent"]
    last_verified: "2026-06-17"

  - id: reject.special-category-qualification
    summary: "特殊行业类目缺少对应资质材料（如医疗类许可证）"
    aliases: ["资质", "许可证", "医疗", "执业许可", "资质材料", "专项资质", "资质不符"]
    codes: []
    rules: ["category.medical-hint", "qualification.provide-materials"]
    last_verified: "2026-06-17"

  - id: reject.filing
    summary: "未完成 ICP 备案即发布（备案是发布前置）"
    aliases: ["备案", "ICP备案", "ICP 备案", "未备案", "工信部", "备案号", "域名备案"]
    codes: []
    rules: ["filing.required-before-release"]
    last_verified: "2026-06-17"

  - id: reject.domain-whitelist
    summary: "请求域名未在小程序后台配置服务器域名白名单"
    aliases: ["服务器域名", "合法域名", "域名白名单", "未配置域名", "域名校验", "request 合法域名", "不在以下合法域名列表"]
    codes: []
    rules: ["domain.request-whitelist"]
    last_verified: "2026-06-17"

  - id: reject.minors
    summary: "面向未成年人 / 含不宜未成年内容但未做保护处理"
    aliases: ["未成年", "青少年", "未成年人", "未成年人保护", "儿童"]
    codes: []
    rules: ["minor.protect"]
    last_verified: "2026-06-17"

  - id: reject.virtual-payment
    summary: "虚拟商品绕开小程序虚拟支付、引导外部渠道（App/H5/公众号）完成支付"
    aliases: ["虚拟支付", "虚拟商品", "外跳支付", "引导外部支付", "内购", "会员充值", "解锁付费", "苹果支付"]
    codes: []
    rules: ["payment.virtual-must-use-official"]
    last_verified: "2026-06-17"

  - id: reject.ecommerce-category
    summary: "电商 / 交易类功能缺少经营资质或主体不符（如增值电信业务经营许可证）"
    aliases: ["电商", "交易类", "商城类目", "增值电信", "在线交易", "经营许可证", "电商平台"]
    codes: []
    rules: ["category.payment-hint"]
    last_verified: "2026-06-17"

  - id: reject.data-consent
    summary: "收集用户数据未告知用途 / 未取得用户明确同意"
    aliases: ["收集数据", "用户数据", "未告知", "未取得同意", "个人信息收集", "未明示", "数据用途"]
    codes: []
    rules: ["data.collection-consent"]
    last_verified: "2026-06-17"

  - id: reject.privacy-clipboard
    summary: "读取剪贴板但未在《用户隐私保护指引》声明"
    aliases: ["剪贴板", "getClipboardData", "读取剪贴板", "粘贴板"]
    codes: []
    rules: ["privacy.clipboard"]
    last_verified: "2026-06-17"

  - id: reject.privacy-camera-album
    summary: "使用相机/相册（拍摄、选图、存图）但未在《用户隐私保护指引》声明"
    aliases: ["相机", "摄像头", "相册", "保存到相册", "选择照片", "选择视频", "拍照"]
    codes: []
    rules: ["privacy.camera", "privacy.writePhotosAlbum", "privacy.choosePhotoVideo"]
    last_verified: "2026-06-17"

  - id: reject.privacy-record
    summary: "使用麦克风录音但未在《用户隐私保护指引》声明"
    aliases: ["麦克风", "录音", "录制音频", "getRecorderManager"]
    codes: []
    rules: ["privacy.record"]
    last_verified: "2026-06-17"

  - id: reject.privacy-phone
    summary: "手机号收集与隐私声明核对"
    aliases: ["手机号", "手机号码", "getPhoneNumber"]
    codes: []
    rules: ["privacy.getPhoneNumber"]
    last_verified: "2026-10-25"

  - id: reject.privacy-profile
    summary: "头像昵称收集与隐私声明核对"
    aliases: ["getUserProfile", "用户头像", "用户昵称"]
    codes: []
    rules: ["privacy.getUserProfile"]
    last_verified: "2026-10-25"

  - id: reject.privacy-location
    summary: "地理位置收集与隐私声明核对"
    aliases: ["getLocation", "地理位置", "位置信息"]
    codes: []
    rules: ["privacy.getLocation"]
    last_verified: "2026-10-25"
