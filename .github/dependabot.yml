# E4：依赖看护——actions 的可变 tag 与 npm 依赖月度巡检。
# 根生产依赖闭包为 js-yaml → argparse；开发依赖也纳入监控，PR 须过全量 CI 门禁才可合。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
