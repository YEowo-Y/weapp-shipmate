# rules/privacy-apis.yaml —— 隐私 API → 必填《用户隐私保护指引》项
# 已核验官方总则来源（2026-06-13）：处理用户个人信息均需补充隐私保护指引，否则提审受阻。
# confidence=medium：总则已核验，单条 API 与具体声明项的精确映射为合理推断（官方页未逐项列出）。
schema_version: 1
rules:
  - id: privacy.getUserProfile
    title: "用户信息隐私声明"
    kind: both
    stage: privacy
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    match:
      api: ["wx.getUserProfile", "wx.getUserInfo"]
      scanner: static_api_call
    requires:
      - "在《小程序用户隐私保护指引》中声明：用户信息（昵称、头像）"
    why: "处理用户个人信息需在隐私指引声明；声明与接口调用不符或为空会在提审被拦截"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/"
    source_quote: "小程序、插件中涉及处理用户个人信息的开发者，均需补充相应用户隐私保护指引；提审时若隐私接口调用情况与隐私协议内容有出入或为空，会被提醒更新。"
    last_verified: "2026-06-13"
    manual_required: true

  - id: privacy.getLocation
    title: "地理位置隐私声明"
    kind: both
    stage: privacy
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    match:
      api: ["wx.getLocation", "wx.chooseLocation", "wx.onLocationChange", "wx.startLocationUpdate"]
      scanner: static_api_call
    requires:
      - "在《小程序用户隐私保护指引》中声明：地理位置信息"
      - "在 app.json 的 requiredPrivateInfos 声明相应位置接口（请对照官方位置接口文档确认）"
    why: "处理位置信息需在隐私指引声明；声明缺失会在提审被拦截，部分位置接口未在 requiredPrivateInfos 声明会调用失败"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/"
    source_quote: "小程序、插件中涉及处理用户个人信息的开发者，均需补充相应用户隐私保护指引。"
    last_verified: "2026-06-13"
    manual_required: true

  - id: privacy.getPhoneNumber
    title: "手机号隐私声明"
    kind: both
    stage: privacy
    subject_type: ["personal", "individual_business", "enterprise"]
    severity: warning
    confidence: medium
    match:
      config_key: ["button.open-type=getPhoneNumber"]
      scanner: static_config
    requires:
      - "在《小程序用户隐私保护指引》中声明：手机号"
    why: "通过 button open-type=getPhoneNumber 获取手机号属处理用户个人信息，未声明会在提审被拦截"
    official_url: "https://developers.weixin.qq.com/miniprogram/dev/framework/user-privacy/"
    source_quote: "小程序、插件中涉及处理用户个人信息的开发者，均需补充相应用户隐私保护指引。"
    last_verified: "2026-06-13"
    manual_required: true
